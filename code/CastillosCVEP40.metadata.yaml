abstract: The utilization of aperiodic flickering visual stimuli under the form of code-modulated Visual Evoked Potentials
  (c-VEP) represents a pivotal advancement in the field of reactive Brain–Computer Interface (rBCI). This study introduces
  an innovative variant of code-VEP, referred to as 'Burst c-VEP', involving the presentation of short bursts of aperiodic
  visual flashes at a deliberately slow rate (2-4 flashes per second). The study tested an offline 4-classes c-VEP protocol
  involving 12 participants with factorial design manipulating pattern (burst and m-sequences) and amplitude (100% or 40%
  depth modulations). Full amplitude burst c-VEP sequences exhibited higher accuracy (90.5% with 17.6s calibration to 95.6%
  with 52.8s calibration) compared to m-sequence (71.4% to 85.0%). Mean selection time was 1.5s. Lowering intensity to 40%
  decreased accuracy slightly to 94.2% while improving user experience substantially.
